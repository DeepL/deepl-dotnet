# Note: This GitLab CI configuration is used for internal testing, users can ignore it.
include:
  - project: '${CI_PROJECT_NAMESPACE}/ci-libs-for-client-libraries'
    file:
      - '/${CI_PROJECT_NAME}/.gitlab-ci.yml'
  - project: 'deepl-org/deepl/devex/gitlab-ci-lib'
    file:
      - '/templates/.secret-detection.yml'
  - template: Security/SAST.gitlab-ci.yml

# Global --------------------------

image: mcr.microsoft.com/dotnet/sdk:5.0-alpine

workflow:
  rules:
    # The tag pipeline must run: that is where the registry publish job fires.
    - if: $CI_COMMIT_TAG
    # The release commit carries only the version and the changelog, both
    # derived from commits that were already checked on the way in.
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\):/
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - check
  - build
  - test
  - publish

variables:
  DOTNET_CLI_HOME: ${CI_PROJECT_DIR}
  XDG_DATA_HOME: ${CI_PROJECT_DIR}
  GITLAB_ADVANCED_SAST_ENABLED: 'true'

# stage: check ----------------------

.license_check_base:
  stage: check
  script:
    - ./license_checker.sh '*.cs' | tee license_check_output.txt
    - '[ ! -s license_check_output.txt ]'

license_check_scheduled:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

license_check_manual:
  extends: .license_check_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

secret_detection:
  extends: .secret-detection
  stage: check
  image: !reference [.secret-detection, image]
  before_script:
    - echo "overriding default before_script..."
  rules:
    - if: $CI_MERGE_REQUEST_ID

gitlab-advanced-sast:
  stage: check
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

semgrep-sast:
  stage: check
  rules:
    - when: always
  variables:
    SAST_EXCLUDED_PATHS: '$DEFAULT_SAST_EXCLUDED_PATHS'
    GIT_STRATEGY: clone

# stage: build ----------------------

build:
  stage: build
  parallel:
    matrix:
      - CONFIGURATION:
          - Debug
          - Release
  script:
    - dotnet build --configuration $CONFIGURATION
  artifacts:
    paths:
      - DeepL/bin/
      - DeepL/obj/
      - DeepLTests/bin/
      - DeepLTests/obj/

package:
  stage: build
  needs: ["build"]
  script:
    # No --no-restore: DOTNET_CLI_HOME puts the NuGet cache inside the
    # workspace and the build artifacts do not include it, so this job
    # only had packages when a runner slot reused a leftover workspace.
    - dotnet pack --configuration Release -o package/Release
  artifacts:
    paths:
      - package/

# stage: test -------------------------

# Offline suite: no secrets and no network. Runs on every runtime.
.test_offline_base:
  stage: test
  dependencies:
    - build
  parallel:
    matrix:
      - DOCKER_IMAGE: "mcr.microsoft.com/dotnet/sdk:5.0-alpine"
        FRAMEWORK: "net5.0"
        CONFIGURATION:
          - Debug
          - Release
      - DOCKER_IMAGE: "mcr.microsoft.com/dotnet/sdk:3.1-alpine"
        FRAMEWORK: "netcoreapp3.1"
        CONFIGURATION:
          - Debug
          - Release
  image: ${DOCKER_IMAGE}
  script:
    - dotnet test
      --configuration $CONFIGURATION
      --framework $FRAMEWORK
      --filter "FullyQualifiedName~DeepLTests.Offline."
      --logger:"junit;LogFilePath=..\artifacts\{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      --collect:"XPlat Code Coverage"
      -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[DeepL.net]*"
  artifacts:
    reports:
      junit:
        - artifacts/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: DeepLTests/TestResults/*/coverage.cobertura.xml
    when: always

test_offline_scheduled:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  retry: 2

test_offline_manual:
  extends: .test_offline_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

# Every endpoint once against the real API; no retry, as a retry repeats every request.
.test_real_api_base:
  stage: test
  extends: .test
  dependencies:
    - build
  image: mcr.microsoft.com/dotnet/sdk:5.0-alpine
  script:
    - dotnet test
      --configuration Release
      --framework net5.0
      --filter "FullyQualifiedName~DeepLTests.RealApi."
      --logger:"junit;LogFilePath=..\artifacts\{assembly}-test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
      --collect:"XPlat Code Coverage"
      -- "DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include=[DeepL.net]*"
  artifacts:
    reports:
      junit:
        - artifacts/*test-result.xml
      coverage_report:
        coverage_format: cobertura
        path: DeepLTests/TestResults/*/coverage.cobertura.xml
    when: always

test_real_api_scheduled:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"

test_real_api_manual:
  extends: .test_real_api_base
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"


# stage: publish -------------------------

nuget upload:
  stage: publish
  extends: .publish
  dependencies:
    - package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - dotnet nuget push package/Release/DeepL.net.*.nupkg --api-key $NUGET_API_KEY
      --source https://api.nuget.org/v3/index.json --timeout 30
